name: Release admin app

# Push a tag such as admin-v1.0.0, or start this workflow by hand with that tag name
# (the release then creates the tag on the default branch), to build the OSISS Admin
# installers and attach them to a GitHub Release. File names are stable so the landing page can link to
# releases/latest/download/<name>. After the first release, set data-released="true"
# on #downloads in site/index.html.
on:
  push:
    tags: ["admin-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. admin-v1.0.0 (created on the default branch if it does not exist)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$DEFAULT_BRANCH" \
                 --title "OSISS Admin ${TAG#admin-v}" \
                 --notes "Desktop admin app for OSISS. Windows and macOS builds are untested; the macOS build is unsigned."

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: admin
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - name: Upload installers under stable names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          up() { # up <glob> <stable name>
            local f; f="$(ls release/$1 2>/dev/null | head -n1 || true)"
            if [ -z "$f" ]; then echo "no file matches $1" >&2; exit 1; fi
            cp "$f" "release/$2"
            gh release upload "$TAG" "release/$2" --repo "$GITHUB_REPOSITORY" --clobber
          }
          case "${{ matrix.os }}" in
            ubuntu-latest)  up '*.AppImage' OSISS-Admin-linux.AppImage; up '*.deb' OSISS-Admin-linux.deb ;;
            windows-latest) up '*.exe' OSISS-Admin-windows.exe ;;
            macos-latest)   up '*.dmg' OSISS-Admin-macos.dmg ;;
          esac
